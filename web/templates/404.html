{% extends "base.html" %}
{% block title %}Page Not Found — ApproveHub{% endblock %}
{% block content %}
<div style="text-align:center;padding:80px 20px;max-width:500px;margin:0 auto;">
    <div style="font-size:100px;font-weight:900;background:linear-gradient(135deg,var(--indigo-primary),var(--cyan-neon));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:16px;animation:floatGentle 3s ease-in-out infinite;">404</div>
    <h2 style="margin:0 0 8px;font-size:20px;font-weight:800;color:var(--tx);">Page Not Found</h2>
    <p style="color:var(--tx-muted);margin:0 0 28px;font-size:14px;">The requested page or document record could not be found in our system.</p>
    <a href="/" class="btn" style="padding:13px 28px;font-size:14px;border-radius:14px;">Return to Dashboard</a>
</div>
{% endblock %}

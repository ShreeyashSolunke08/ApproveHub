name: Build & Package Android Mobile App (Capacitor)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Native Android APK & Play Store Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Node Dependencies
        run: |
          npm install

      - name: Initialize & Sync Android Native Project
        run: |
          mkdir -p web/static
          npx cap add android || true
          npx cap sync android

      - name: Generate Institutional Release Keystore
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias approvehub -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass approvehub2026 -keypass approvehub2026 \
            -dname "CN=Shreeyash Solunke, OU=Information Technology, O=Vishwakarma Institute of Technology, L=Pune, ST=Maharashtra, C=IN"

      - name: Build Android Debug APK, Release APK & App Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Sign Release APK & AAB
        run: |
          # Sign unsigned release APK
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore -storepass approvehub2026 -keypass approvehub2026 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk approvehub || true

          # Rename signed APK
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/ApproveHub-v1.0-release.apk || true

          # Sign release AAB for Play Store
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore -storepass approvehub2026 -keypass approvehub2026 \
            android/app/build/outputs/bundle/release/app-release.aab approvehub || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApproveHub-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Production Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApproveHub-Android-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Google Play Store Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApproveHub-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

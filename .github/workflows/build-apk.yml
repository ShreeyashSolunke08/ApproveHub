name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create package.json if not present
        run: |
          if [ ! -f package.json ]; then
            cat << 'EOF' > package.json
          {
            "name": "approvehub-mobile",
            "version": "1.0.0",
            "description": "ApproveHub Android & Cross-Platform Application",
            "scripts": {
              "build": "echo 'Static web assets ready in web/'"
            },
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF
          fi

      - name: Install NPM Dependencies & Capacitor
        run: |
          npm install

      - name: Initialize & Sync Android Native Shell
        run: |
          mkdir -p web/static
          npx cap sync android || (npx cap add android && npx cap sync android)

      - name: Build Android Debug APK with Gradle
        run: |
          if [ -d android ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "Android directory generated, ready for APK package"
          fi

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApproveHub-Android-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30
